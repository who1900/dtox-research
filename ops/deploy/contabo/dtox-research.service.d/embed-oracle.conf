[Service]
# Second chunk-embedding backend: the bge-small engine of dtox-embed-base on
# Oracle (same int8 model file as embed-small, verified by cosine on real
# chunks), reached through the existing tunnel 16337 -> Oracle 127.0.0.1:8090.
# First URL = local embed-small (EMBED_WORKERS in flight), second = Oracle
# (EMBED_EXTRA_URL_WORKERS in flight). Failing URL -> batch retried on the other.
Environment=EMBED_BATCH_URLS=http://127.0.0.1:8005/embed_batch,http://127.0.0.1:16337/small/embed_batch
Environment=EMBED_EXTRA_URL_WORKERS=1
