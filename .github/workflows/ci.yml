name: Checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-test.txt
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.txt -r embed/requirements.txt
      - run: python -m compileall -q api mcp ops pipeline embed
      - run: python -m unittest discover -s api/tests -p 'test_*.py'
      - run: python -m unittest discover -s eval/tests -p 'test_*.py'
      - run: python -m unittest discover -s mcp/tests -p 'test_*.py'
      - name: Fast offline pipeline regressions
        run: python -m unittest discover -s pipeline/tests -p 'test_*.py'
        timeout-minutes: 1
      - name: Fast offline operations regressions
        run: python -m unittest discover -s ops/tests -p 'test_*.py'
        timeout-minutes: 1
      - name: PDF candidate and memory fixtures
        run: python -m pytest -p no:cacheprovider ops/tests/test_pdf_unicode_repair.py pipeline/tests/test_pdf_memory.py -q
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: npm ci
        working-directory: x402-gateway
      - run: npm test
        working-directory: x402-gateway
      - run: npm run build
        working-directory: x402-gateway
      - run: npm ci
        working-directory: attestor
      - run: npm test
        working-directory: attestor
      - run: npm run build
        working-directory: attestor
